<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080E1B" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#4D7CFF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <!-- Main Monogram Neon Gradient -->
    <linearGradient id="neonGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Internal Grid Accent -->
  <path d="M12 20h40M12 44h40M20 12v40M44 12v40" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4" />

  <!-- Geometric "A" Glyph with Ambient Neon Glow -->
  <g filter="url(#glow)">
    <!-- Left Leg -->
    <path d="M32 12 L16 48 L22.5 48 L26.5 38 L37.5 38 L41.5 48 L48 48 Z" fill="url(#neonGrad)" />
    <!-- Inner Cutout Triangle -->
    <path d="M32 22 L28.5 32 L35.5 32 Z" fill="#080E1B" />
  </g>

  <!-- Sharp Terminal Micro-Cursor Highlight -->
  <polygon points="32,12 36,22 32,24 28,22" fill="#00F5FF" opacity="0.9" />
  <rect x="38" y="35" width="4" height="3" rx="1" fill="#00F5FF" />
</svg>